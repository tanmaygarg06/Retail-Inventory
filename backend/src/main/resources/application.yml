spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://localhost:5432/rism_db
    username: rism_user
    password: rism_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # We manage schema via schema.sql in Docker/Flyway, so just validate entities
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  error:
    include-message: always

# JWT config placeholder for Phase 4
app:
  jwt:
    secret: "placeholder-secret-key-will-be-replaced-in-env"
    expiration: 86400000 # 24 hours
