version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rism_postgres
    environment:
      POSTGRES_USER: rism_user
      POSTGRES_PASSWORD: rism_password
      POSTGRES_DB: rism_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
    restart: unless-stopped
    networks:
      - rism_network

  # Backend and Frontend services can be uncommented later when Dockerfiles are ready
  # backend:
  #   build:
  #     context: ./backend
  #   container_name: rism_backend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/rism_db
  #     - SPRING_DATASOURCE_USERNAME=rism_user
  #     - SPRING_DATASOURCE_PASSWORD=rism_password
  #   depends_on:
  #     - postgres
  #   networks:
  #     - rism_network
  #
  # frontend:
  #   build:
  #     context: ./frontend
  #   container_name: rism_frontend
  #   ports:
  #     - "3000:80"
  #   depends_on:
  #     - backend
  #   networks:
  #     - rism_network

volumes:
  postgres_data:

networks:
  rism_network:
    driver: bridge
